<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railtrack Fitting Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to right, #ece9e6, #ffffff);
        }
        .card {
            background-color: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 90%;
            width: 400px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Main Container -->
    <div class="container">

        <!-- Login Card -->
        <div id="login-card" class="card">
            <h1 class="text-3xl font-bold text-gray-900 text-center mb-6" data-lang-key="loginTitle">Login to Scan</h1>
            
            <!-- Language Dropdown -->
            <div class="mb-4">
                <label for="language-select" class="block text-sm font-medium text-gray-700" data-lang-key="languageLabel">Select Language</label>
                <select id="language-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                    <option value="en">English</option>
                    <option value="de">German</option>
                </select>
            </div>

            <form id="login-form">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700" data-lang-key="usernameLabel">Username</label>
                    <input type="text" id="username" name="username" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700" data-lang-key="passwordLabel">Password</label>
                    <input type="password" id="password" name="password" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" required>
                </div>
                <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" data-lang-key="loginButton">Log In</button>
            </form>
            <div id="error-message" class="text-red-600 text-center mt-4 hidden" role="alert"></div>
        </div>

        <!-- Scanner Card -->
        <div id="scanner-card" class="card hidden">
            <h1 class="text-3xl font-bold text-gray-900 text-center mb-6" data-lang-key="scannerTitle">Scan QR Code</h1>
            <div id="qr-reader" style="width: 100%;"></div>
        </div>

        <!-- Details Card -->
        <div id="details-card" class="card hidden">
            <h1 class="text-3xl font-bold text-gray-900 text-center mb-6" data-lang-key="detailsTitle">Fitting Details</h1>
            <div id="details-content" class="text-sm text-gray-700 space-y-3">
                <!-- Details will be populated here -->
            </div>
            <button id="scan-again-btn" class="mt-6 w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" data-lang-key="scanAgainButton">Scan Again</button>
        </div>

    </div>

    <!-- Message Box for Alerts -->
    <div id="message-box-container" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 id="message-box-title" class="text-lg leading-6 font-medium text-gray-900"></h3>
                <div class="mt-2 px-7 py-3">
                    <p id="message-box-content" class="text-sm text-gray-500"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="message-box-ok-btn" class="px-4 py-2 bg-indigo-600 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" data-lang-key="okButton"></button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // API Configuration
        const API_URL = "http://127.0.0.1:5000";

        // DOM elements
        const loginCard = document.getElementById('login-card');
        const scannerCard = document.getElementById('scanner-card');
        const detailsCard = document.getElementById('details-card');
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const detailsContent = document.getElementById('details-content');
        const scanAgainBtn = document.getElementById('scan-again-btn');
        const languageSelect = document.getElementById('language-select');
        const messageBoxContainer = document.getElementById('message-box-container');
        const messageBoxTitle = document.getElementById('message-box-title');
        const messageBoxContent = document.getElementById('message-box-content');
        const messageBoxOkBtn = document.getElementById('message-box-ok-btn');

        // Multi-language strings
        const translations = {
            en: {
                loginTitle: "Login to Scan",
                usernameLabel: "Username",
                passwordLabel: "Password",
                loginButton: "Log In",
                scannerTitle: "Scan QR Code",
                detailsTitle: "Fitting Details",
                vendorNameLabel: "Vendor Name:",
                manufactureDateLabel: "Manufacture Date:",
                inspectionHistoryLabel: "Inspection History:",
                warrantyPeriodLabel: "Warranty Period:",
                scanAgainButton: "Scan Again",
                languageLabel: "Select Language",
                okButton: "OK",
                loginFailed: "Login failed. Please check your credentials.",
                passwordRequirement: "Password must contain at least one lowercase letter, one uppercase letter, and one number."
            },
            de: {
                loginTitle: "Zum Scannen anmelden",
                usernameLabel: "Benutzername",
                passwordLabel: "Passwort",
                loginButton: "Anmelden",
                scannerTitle: "QR-Code scannen",
                detailsTitle: "Einbaudetails",
                vendorNameLabel: "Anbietername:",
                manufactureDateLabel: "Herstellungsdatum:",
                inspectionHistoryLabel: "Inspektionshistorie:",
                warrantyPeriodLabel: "Garantiezeitraum:",
                scanAgainButton: "Erneut scannen",
                languageLabel: "Sprache auswählen",
                okButton: "OK",
                loginFailed: "Anmeldung fehlgeschlagen. Bitte überprüfen Sie Ihre Anmeldedaten.",
                passwordRequirement: "Das Passwort muss mindestens einen Kleinbuchstaben, einen Großbuchstaben und eine Zahl enthalten."
            }
        };

        // Function to show a custom message box
        function showMessageBox(title, content) {
            messageBoxTitle.textContent = title;
            messageBoxContent.textContent = content;
            messageBoxOkBtn.textContent = translations[languageSelect.value].okButton;
            messageBoxContainer.classList.remove('hidden');
        }

        // Event listener for the OK button on the message box
        messageBoxOkBtn.addEventListener('click', () => {
            messageBoxContainer.classList.add('hidden');
        });

        // Function to update the UI based on the selected language
        function updateLanguage() {
            const lang = languageSelect.value;
            const elements = document.querySelectorAll('[data-lang-key]');
            elements.forEach(el => {
                const key = el.getAttribute('data-lang-key');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }
        
        // Initial language update
        updateLanguage();

        // Event listener for language selection change
        languageSelect.addEventListener('change', updateLanguage);

        // --- Authentication Logic ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const lang = languageSelect.value;

            // Password validation
            const hasLowercase = /[a-z]/.test(password);
            const hasUppercase = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            if (!hasLowercase || !hasUppercase || !hasNumber) {
                errorMessage.textContent = translations[lang].passwordRequirement;
                errorMessage.classList.remove('hidden');
                return;
            }

            // Send login request to the backend
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Login successful:', data);
                    loginCard.classList.add('hidden');
                    scannerCard.classList.remove('hidden');
                    errorMessage.classList.add('hidden');
                    // Start the QR code scanner after successful login
                    startScanner();
                } else {
                    const errorData = await response.json();
                    errorMessage.textContent = errorData.error || translations[lang].loginFailed;
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = translations[lang].loginFailed;
                errorMessage.classList.remove('hidden');
            }
        });

        // --- QR Code Scanner Logic ---
        let html5QrCode;

        function startScanner() {
            if (html5QrCode) {
                // Stop any previous scanner instance
                html5QrCode.stop().then(ignore => {}).catch(err => {
                    console.warn('Failed to stop scanner:', err);
                });
            }

            const qrCodeSuccessCallback = async (decodedText, decodedResult) => {
                console.log(`QR code detected: ${decodedText}`);
                
                // Stop the scanner immediately after a successful scan
                if (html5QrCode) {
                    html5QrCode.stop().then(ignore => {
                        console.log("QR code scanner stopped.");
                    }).catch(err => {
                        console.error("Error stopping the scanner:", err);
                    });
                }
                
                try {
                    // Parse the JSON string from the QR code
                    const qrData = JSON.parse(decodedText);
                    const fittingId = qrData.id;

                    // Fetch fitting details from the backend
                    const response = await fetch(`${API_URL}/fitting/${fittingId}`);
                    if (response.ok) {
                        const fittingDetails = await response.json();
                        displayFittingDetails(fittingDetails);
                    } else {
                        const errorData = await response.json();
                        showMessageBox('Error', errorData.error);
                    }
                } catch (error) {
                    console.error('Failed to parse QR code or fetch data:', error);
                    showMessageBox('Error', 'Invalid QR code format or network issue.');
                }
            };
            
            html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                qrCodeSuccessCallback,
                (errorMessage) => {
                    // This is a continuous feed of errors while scanning, so we log it but don't show a popup
                    console.warn(errorMessage);
                }
            ).catch((err) => {
                // This error occurs if camera permission is denied or no camera is found
                showMessageBox('Error', `Camera access failed: ${err}`);
            });
        }

        // --- UI Display Logic ---
        function displayFittingDetails(details) {
            scannerCard.classList.add('hidden');
            detailsCard.classList.remove('hidden');
            detailsContent.innerHTML = ''; // Clear previous content

            const lang = languageSelect.value;
            
            // Render the details from the fetched data
            const vendorNameEl = document.createElement('p');
            vendorNameEl.innerHTML = `<span class="font-bold" data-lang-key="vendorNameLabel">${translations[lang].vendorNameLabel}</span> ${details.vendorName}`;
            detailsContent.appendChild(vendorNameEl);

            const manufactureDateEl = document.createElement('p');
            manufactureDateEl.innerHTML = `<span class="font-bold" data-lang-key="manufactureDateLabel">${translations[lang].manufactureDateLabel}</span> ${details.manufactureDate}`;
            detailsContent.appendChild(manufactureDateEl);

            const inspectionHistoryEl = document.createElement('div');
            inspectionHistoryEl.innerHTML = `<p class="font-bold mb-1" data-lang-key="inspectionHistoryLabel">${translations[lang].inspectionHistoryLabel}</p>`;
            const historyList = document.createElement('ul');
            historyList.className = 'list-disc list-inside space-y-1';
            details.inspectionHistory.forEach(item => {
                const listItem = document.createElement('li');
                listItem.textContent = item;
                historyList.appendChild(listItem);
            });
            inspectionHistoryEl.appendChild(historyList);
            detailsContent.appendChild(inspectionHistoryEl);

            const warrantyPeriodEl = document.createElement('p');
            warrantyPeriodEl.innerHTML = `<span class="font-bold" data-lang-key="warrantyPeriodLabel">${translations[lang].warrantyPeriodLabel}</span> ${details.warrantyPeriod}`;
            detailsContent.appendChild(warrantyPeriodEl);
        }

        // Event listener for the "Scan Again" button
        scanAgainBtn.addEventListener('click', () => {
            detailsCard.classList.add('hidden');
            scannerCard.classList.remove('hidden');
            startScanner(); // Restart the scanner
        });

    </script>
</body>
</html>
